version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lbs_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root # MySQL root 계정의 비밀번호
      MYSQL_DATABASE: lbs # 자동으로 'lbs' 데이터베이스를 생성합니다.
      MYSQL_USER: lbsuser # 자동으로 'lbsuser' 사용자를 생성합니다.
      MYSQL_PASSWORD: 1234  # 위 사용자의 비밀번호를 설정합니다.

    # 포트를 연결합니다. "내컴퓨터 포트:컨테이너 포트" 형식입니다.
    # 이렇게 하면 내 컴퓨터의 3306 포트로 들어오는 요청을
    # 도커 안에서 실행되는 MySQL의 3306 포트로 전달해줍니다.
    ports:
      - "3306:3306"

    # MySQL 서버 실행 시 기본 옵션을 설정합니다. (한글 깨짐 방지)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    # 데이터베이스 데이터를 내 컴퓨터에 저장해서 컨테이너가 삭제돼도 데이터가 보존되게 합니다.
    volumes:
      - db-data:/var/lib/mysql

# 위에서 사용한 볼륨(db-data)을 정의합니다.
volumes:
  db-data: